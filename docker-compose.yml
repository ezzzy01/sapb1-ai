# SAP B1 AI chat site, shared by all companies. People pick their company in the model menu and only see the
# companies whose group they are in; each company has its own chat service, SQL login and data behind it.
# Companies are put on the site by ./company.sh (connections, groups, access), not here.
#   Start:  ./company.sh site      Open: http://<desktop>:3100
# Separate from the personal Open WebUI (~/local-ai, port 3000).
name: sapb1-ai

services:
  webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: sapb1-ai-webui
    restart: unless-stopped
    ports:
      - "3100:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEBUI_NAME: "SAP B1 AI"
      # Only the companies' chat services (set by ./company.sh); no direct model or internet access from the site.
      ENABLE_OLLAMA_API: "false"
      ENABLE_WEB_SEARCH: "false"
      # Privacy: chats stay with the person who wrote them; admins see every company but not users' chats.
      ENABLE_ADMIN_CHAT_ACCESS: "false"
      ENABLE_ADMIN_EXPORT: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - webui-data:/app/backend/data
      # Fiori Horizon theme: custom.css imports webui/fiori.css; edits apply on browser refresh.
      - ./webui/custom.css:/app/build/static/custom.css:ro
      # Company dropdown on the login page (replaces Open WebUI's empty loader.js; restart the site after editing).
      - ./webui/loader.js:/app/build/static/loader.js:ro
      - ./webui:/app/backend/open_webui/static/sapb1:ro

volumes:
  webui-data:
