# SAP B1 AI chat site. One address and one sign-in for all companies, but every company has its own chat site:
# its own Open WebUI, database (chats, accounts, files), chat service, SQL login and data behind it.
#   proxy (this file)                  port 3100: the sign-in page (sapb1-ai-portal, src/sapb1_ai/portal.py), then
#                                      each person only to the company chosen at sign-in (site/caddy/Caddyfile)
#   webui-<company> (generated)        site/docker-compose.companies.yml, written by ./company.sh from companies/
#   Start:  ./company.sh site      Open: http://<desktop>:3100      People: ./company.sh user ...
# Separate from the personal Open WebUI (~/local-ai, port 3000).
name: sapb1-ai

services:
  proxy:
    image: caddy:2
    container_name: sapb1-ai-proxy
    restart: unless-stopped
    ports:
      - "3100:3100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./site/caddy:/etc/caddy:ro
      - caddy-data:/data

volumes:
  caddy-data:
  # The former shared site (all companies in one Open WebUI), kept unchanged as a fallback; not used.
  webui-data:
